# برای هر سیستم عامل تست می‌گیرد و نسخهٔ نصبی می‌سازد.
# با هر تگ v* فایل‌ها به Release همان نسخه اضافه می‌شوند.
# اجرای دستی: gh workflow run release.yml
name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUTF8: "1"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, label: mac-apple-silicon }
          - { os: macos-15-intel, label: mac-intel }
          - { os: windows-latest, label: windows }
          - { os: ubuntu-22.04, label: linux }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install
        shell: bash
        run: |
          python -m venv .venv
          if [ "$RUNNER_OS" = "Windows" ]; then PY=.venv/Scripts/python; else PY=.venv/bin/python; fi
          echo "PY=$PY" >> "$GITHUB_ENV"
          $PY -m pip install -q -r requirements.txt -r requirements-build.txt

      - name: Tests
        shell: bash
        run: $PY -m pytest -q

      - name: Build (Mac)
        if: runner.os == 'macOS'
        run: zsh tools/build_release.sh

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install innosetup -y --no-progress
          $PY tools/build_release.py

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: $PY tools/build_release.py

      - name: Smoke test the built app
        shell: bash
        run: |
          case "$RUNNER_OS" in
            macOS)   BIN=build/release/Dibacheh.app/Contents/Resources/dibacheh-server/dibacheh-server ;;
            Windows) BIN=build/release/dist/Dibacheh/Dibacheh.exe ;;
            Linux)   BIN=$(ls build/release/*.AppImage) ;;
          esac
          $PY tools/smoke_test.py "$BIN"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.label }}
          if-no-files-found: error
          path: |
            build/release/*.dmg
            build/release/*.exe
            build/release/*.zip
            build/release/*.AppImage
            build/release/*.tar.gz

      - name: Add to Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "" --draft
          for f in build/release/*.dmg build/release/*.exe build/release/*.zip build/release/*.AppImage build/release/*.tar.gz; do
            if [ -f "$f" ]; then gh release upload "$GITHUB_REF_NAME" "$f" --clobber; fi
          done
